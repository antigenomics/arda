<text x="56" y="386" font-size="24" fill="#1a2332" font-weight="700">Sequence input</text>
<text x="56" y="420" font-size="17" fill="#54657a" font-weight="400">Bulk, amplicon or single cell</text>
<text x="56" y="447" font-size="17" fill="#54657a" font-weight="400">Nucleotide or protein sequences</text>
<text x="446" y="386" font-size="24" fill="#1a2332" font-weight="700">Batched annotation</text>
<text x="446" y="420" font-size="17" fill="#54657a" font-weight="400">Germline search + region transfer</text>
<text x="446" y="447" font-size="17" fill="#54657a" font-weight="400">V / D / J / C and candidate evidence</text>
<text x="836" y="386" font-size="24" fill="#1a2332" font-weight="700">AIRR output</text>
<text x="836" y="420" font-size="17" fill="#54657a" font-weight="400">Regions, junctions and gene calls</text>
<text x="836" y="447" font-size="17" fill="#54657a" font-weight="400">Clonotypes, pairing and run QC</text>
<path d="M56 483 H1144" fill="none" stroke="#e6e9ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="56" y="522" width="27" height="4" fill="#3f75ac" opacity="1"/>
<text x="56" y="566" font-size="23" fill="#1a2332" font-weight="700">Reads → clonotypes</text>
<text x="56" y="603" font-size="16" fill="#54657a" font-weight="400">Choose rnaseq, amplicon or cells.</text>
<text x="56" y="629" font-size="16" fill="#54657a" font-weight="400">Paired reads stay paired through assembly.</text>
<rect x="446" y="522" width="27" height="4" fill="#168b78" opacity="1"/>
<text x="446" y="566" font-size="23" fill="#1a2332" font-weight="700">Sequences → regions</text>
<text x="446" y="603" font-size="16" fill="#54657a" font-weight="400">Use annotate_sequences for one batch.</text>
<text x="446" y="629" font-size="16" fill="#54657a" font-weight="400">Coordinates are 1-based and closed.</text>
<rect x="836" y="522" width="27" height="4" fill="#b17b20" opacity="1"/>
<text x="836" y="566" font-size="23" fill="#1a2332" font-weight="700">Evidence → inference</text>
<text x="836" y="603" font-size="16" fill="#54657a" font-weight="400">Keep alternative alignments for models.</text>
<text x="836" y="629" font-size="16" fill="#54657a" font-weight="400">A chosen call is not a recombination history.</text>
<path d="M56 678 H1144" fill="none" stroke="#e6e9ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="56" y="719" font-size="17" fill="#54657a" font-weight="400">Python API + CLI</text>
<text x="735" y="719" font-size="16" fill="#54657a" font-weight="400">Batch APIs · shared resources · automatic CPU budgets</text>
