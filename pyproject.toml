[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "arda-mapper"  # PyPI distribution name (`arda` is taken); imports as `arda`
version = "2.13.0"
description = "Antigen Receptor Domain Annotation — fast TCR/BCR FR/CDR region annotation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPLv3" }
authors = [{ name = "Mikhail Shugay", email = "mikhail.shugay@gmail.com" }]
keywords = ["immunology", "tcr", "bcr", "airr", "igblast", "mmseqs2", "annotation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "polars>=1.0",
    "typer>=0.12",
    "requests>=2.31",
    # `arda rnaseq correct` -- CDR3 error correction (neighbour search). REQUIRED, not optional:
    # as an extra it produced the worst failure mode this package had. A plain
    # `pip install arda-mapper` would map and assemble a 100M-read sample for 45 minutes, then die
    # on a bare ModuleNotFoundError before writing a single clonotype -- after all the expensive
    # work, and past every smoke test, because `arda --version` succeeds without it. seqtree ships
    # the same 12 wheels on the same platforms as arda (py3.10-3.13, linux/mac/win) and pulls no
    # runtime deps of its own, so requiring it costs nothing.
    "seqtree>=0.4",
    # C-accelerated FASTQ/FASTA parsing (cutadapt's parser). Once `--prefilter` removed the search,
    # reading became the largest single cost of a bulk run -- 65 % of a 0.024 %-receptor library --
    # and dnaio is 2x the reworked pure-Python loop including mate tagging. Required rather than
    # optional because it makes the two assertions the pure-Python reader makes, and both are
    # load-bearing: a truncated mate file and a shuffled one each produced a published false
    # discovery in this project's benchmark that had to be retracted. A fallback path is kept so a
    # source checkout without it still runs, but a release should not silently be 2x slower.
    "dnaio>=1.2",
]

[project.optional-dependencies]
docs = ["sphinx", "pydata-sphinx-theme", "nbsphinx"]
test = ["pytest", "pytest-cov", "airr>=1.4"]  # airr: validate the AIRR Rearrangement schema
dev = ["ruff", "pytest", "pybind11"]
# Kept as an empty alias so existing `arda-mapper[rnaseq]` pins (the Nextflow module, collaborator
# instructions, older docs) keep resolving without a warning. seqtree is a core dependency now.
rnaseq = []
# An empty alias, like `rnaseq` above, and for a sharper reason: an extra naming a package PyPI
# does not have is a hard resolution FAILURE, not a soft one. `arda-mmseqs` is built by
# .github/workflows/publish-mmseqs.yml but has never been uploaded, so as a real dependency this
# extra turned `pip install 'arda-mapper[mmseqs]'` -- which the README, the docs and
# `mmseqs_binary()`'s own error message all recommend -- into `No matching distribution found`.
#
# Nothing is lost by emptying it. The bundled wheel was only ever a convenience over the runtime
# auto-fetch, which pulls the same static binary and is what a plain install already does; both
# need the network exactly once. Restore the pin when the distribution is actually published.
mmseqs = []
# Tests only: OLGA's generative model supplies ground-truth V/J trims (and D spans) for
# `arda.cdr3fix`. Kept out of `test`/`dev` so the normal suite never imports it.
groundtruth = ["olga"]

[project.scripts]
arda = "arda.cli:app"

[project.urls]
Homepage = "https://github.com/antigenomics/arda"
Repository = "https://github.com/antigenomics/arda"

[tool.scikit-build]
wheel.packages = ["src/arda"]
cmake.version = ">=3.18"
build-dir = "build/{wheel_tag}"
# Keep the editable install rebuilding the C++ ext automatically on import.
editable.rebuild = true
editable.verbose = false

[tool.ruff]
line-length = 100
target-version = "py310"

# Rules are SELECTED EXPLICITLY, not inherited. ruff's defaults change between releases, and CI
# installs ruff unpinned -- so a green local `ruff check src/` turned into 114 CI errors on a ruff
# whose defaults had widened, 39 of them B008 complaining about `typer.Option(...)` in a default
# argument, which is exactly how typer is meant to be used. An unpinned linter in a required gate
# fails on someone else's release note.
# E4/E7/E9 + F is the classic pyflakes+pycodestyle core: real errors, no style opinions. It is
# what was green when this gate was added, and it is what caught the 16 errors that prompted it.
# `I` (import order) is deliberately NOT selected -- it flags 15 files this round touched none of,
# and a lint gate whose first act is a repo-wide reorder is a gate people start ignoring.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
