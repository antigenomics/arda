name: docs

on:
  push:
    branches: [master]
  # Build (not deploy) on PRs too. `sphinx-build -W` is a gate, and gating only on the push to
  # master means a broken docs build is discovered after it has already landed.
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Per-ref, so a PR build cannot cancel the master build that is deploying the site.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install docs toolchain
        # autodoc imports arda from ../src with the C++ ext + typer/requests mocked (see
        # docs/conf.py); polars is imported at module level by the rnaseq API (real, not mockable).
        run: pip install sphinx pydata-sphinx-theme nbsphinx polars seqtree
      - name: Build HTML (fail on warnings)
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
