name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install build toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - name: Install MMseqs2 (static binary)
        run: |
          curl -fsSL https://mmseqs.com/latest/mmseqs-linux-avx2.tar.gz -o mmseqs.tar.gz
          tar xzf mmseqs.tar.gz
          echo "ARDA_MMSEQS=$PWD/mmseqs/bin/mmseqs" >> "$GITHUB_ENV"

      - name: Install arda (builds the C++ extension)
        # Install build deps into the runtime env and build without isolation, so
        # the editable on-import rebuild (editable.rebuild=true) can find nanobind.
        # `airr` (a .[test] dep, sdist-only) is pre-installed here WITH isolation so the
        # --no-build-isolation step below sees it satisfied instead of failing to build it.
        # seqtree is a core dependency now, so `.[test]` is enough -- it used to be an extra, and
        # skips, so CI never exercised the clonotype error model or its deterministic
        # row ordering. Nine tests were being skipped, not passing.
        run: |
          uv pip install --system scikit-build-core 'nanobind>=2.5,<3' ninja airr
          uv pip install --system -e .[test] --no-build-isolation

      # Lint gates the source, not the tests -- `src/` is what ships. Ran before the tests so a
      # style break is reported in seconds rather than after the C++ build and the full suite.
      - name: Lint
        # PINNED. An unpinned linter in a required gate fails on someone else's release note:
        # ruff's default rule set widened between releases and a green local run became 114 CI
        # errors, 39 of them objecting to `typer.Option(...)` in a default argument. The rule set
        # itself is pinned in pyproject.toml for the same reason.
        run: uv pip install --system 'ruff==0.15.9' && ruff check src/

      - name: Show environment
        run: |
          "$ARDA_MMSEQS" version
          python -c "import arda, arda._markup as m; print('arda', arda.__version__, '_markup', m.__version__)"

      # Unit + synthetic + real-world (offline, against committed fixtures + DB).
      # The committed mmseqs indexes are version-tagged; if CI's mmseqs differs,
      # arda transparently rebuilds a private cache — this also exercises that path.
      - name: Run tests
        run: python -m pytest tests/unit tests/synthetic tests/realworld -q


  cache-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cache-test dependencies
        run: python -m pip install pytest "polars>=1.0,<2" "requests>=2.31"
      - name: Verify Windows cache coordination and crash recovery
        run: >-
          python -m pytest tests/unit/test_lock_recovery.py
          tests/unit/test_database_fetch_atomic.py tests/unit/test_download_reliability.py
          tests/unit/test_reference_url.py tests/unit/test_igblast_fetch.py
          tests/unit/test_mmseqs_fetch.py -q
      - name: Verify native Windows CPU topology and budget
        shell: python
        run: |
          import runpy
          cpu = runpy.run_path("src/arda/_threads.py")
          logical, physical = cpu["_windows_cpu_counts"]()
          resolve = cpu["resolve_threads"]
          assert 1 <= physical <= logical
          assert resolve() == physical
          assert resolve(logical) == logical
          try:
              resolve(logical + 1)
          except ValueError:
              pass
          else:
              raise AssertionError("Oversized Windows CPU budget accepted")
          print({"logical": logical, "physical": physical, "automatic": resolve()})

  annotation-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install wheel from source
        run: python -m pip install .
      - name: Cold native Windows annotation outside checkout
        shell: python
        run: |
          import csv, os, pathlib, subprocess, tempfile
          source = pathlib.Path.cwd() / "examples" / "example.fasta"
          work = pathlib.Path(tempfile.mkdtemp(prefix="arda windows space "))
          os.chdir(work)
          for key in ("ARDA_HOME", "ARDA_MMSEQS", "ARDA_NO_AUTO_FETCH", "PYTHONPATH"):
              os.environ.pop(key, None)
          os.environ["XDG_CACHE_HOME"] = str(work / "cold cache")
          import arda
          from arda import mmseqs
          assert mmseqs.run(["not-a-real-command"], check=False).returncode != 0
          out = work / "annotation output.tsv"
          subprocess.run(["arda", "annotate", "-i", str(source), "-o", str(out)], check=True)
          rows = list(csv.DictReader(out.open(), delimiter="\t", quoting=csv.QUOTE_NONE))
          assert len(rows) == 5 and all(row["v_call"] and row["j_call"] for row in rows)
          records = arda.annotate_sequences([("q", rows[0]["sequence"])])
          assert len(records) == 1 and records[0]["v_call"] and records[0]["junction"]
          print({"binary": mmseqs.mmseqs_binary(), "rows": len(rows)})
          from arda import igblast
          os.environ.pop("ARDA_IGBLAST", None)
          tool = igblast.tool("igblastn")
          version = subprocess.run([str(tool), "-version"], check=True, capture_output=True, text=True)
          assert "igblastn" in version.stdout
          ungapped = work / "ungapped.fa"
          gapped = work / "gapped.fa"
          gapped.write_text(">sequence\nAC.G.T\n")
          igblast.edit_imgt_file(gapped, ungapped)
          assert ungapped.read_text() == ">sequence\nACGT\n"
          db = igblast.makeblastdb(ungapped, work / "tiny db")
          subprocess.run([str(igblast.tool("blastdbcmd")), "-db", '"' + str(db) + '"', "-info"], check=True)
          print({"igblast": str(tool), "version": version.stdout.strip()})
