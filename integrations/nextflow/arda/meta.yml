name: arda_assign
description: |
  V(D)J assignment and clonotype assembly with arda, shaped for nf-core/airrflow.
  A drop-in alternative to CHANGEO_ASSIGNGENES + CHANGEO_MAKEDB: the same [meta, reads]
  channel in, a spec-valid AIRR Rearrangement TSV out. arda does the IgBLAST work once,
  offline, when its reference is built, so there is no per-run germline database to stage.
keywords:
  - airr
  - immunoglobulin
  - tcr
  - bcr
  - repertoire
  - vdj
  - clonotype
tools:
  - arda:
      description: "Antigen Receptor Domain Annotation - reference-precomputed AIRR annotation"
      homepage: "https://github.com/antigenomics/arda"
      documentation: "https://github.com/antigenomics/arda"
      tool_dev_url: "https://github.com/antigenomics/arda"
      licence: ["GPL-3.0"]
      identifier: "biotools:arda"
input:
  - - meta:
        type: map
        description: |
          Groovy Map describing the sample, in nf-core/airrflow's shape:
          `[ id:'sample_id', species:'human', locus:'IG', single_cell:false, single_end:false ]`.
          `species` selects arda's reference organism and comes from the samplesheet's required
          `species` column. `single_cell:true` is REFUSED - see the note under `output`.
    - reads:
        type: file
        description: |
          FASTQ file(s). Pair-adjacent when paired: [r1, r2, r1, r2, ...]. A sample delivered in
          several read groups (repeated `sample_id` rows) is passed whole - arda maps each group
          and concatenates before the global stages, which is byte-identical to the same reads in
          one file. Order is DECLARED order and must not be sorted.
        pattern: "*.{fastq,fq}{,.gz}"
output:
  airr:
    - - meta:
          type: map
          description: Groovy Map describing the sample
      - "*.airr.tsv":
          type: file
          description: AIRR Rearrangement TSV, one row per mapped read
          pattern: "*.airr.tsv"
  clones:
    - - meta:
          type: map
          description: Groovy Map describing the sample
      - "*.clones.tsv":
          type: file
          description: Clonotype table after error correction
          pattern: "*.clones.tsv"
  assembled_airr:
    - - meta:
          type: map
          description: Groovy Map describing the sample
      - "*.assembled.airr.tsv":
          type: file
          description: AIRR rows for reads recovered by contig assembly (optional)
          pattern: "*.assembled.airr.tsv"
  report:
    - - meta:
          type: map
          description: Groovy Map describing the sample
      - "*.arda.json":
          type: file
          description: Per-run report - counts, timings, peak RSS
          pattern: "*.arda.json"
  stats:
    - - meta:
          type: map
          description: Groovy Map describing the sample
      - "*.stats.tsv":
          type: file
          description: Per-sample QC metrics for `arda qc batch` (optional)
          pattern: "*.stats.tsv"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@mikessh"
maintainers:
  - "@mikessh"
