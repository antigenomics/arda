---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "arda"
description: Extract a TCR/BCR repertoire from bulk RNA-seq or RepSeq amplicon reads as AIRR clonotypes
keywords:
  - airr
  - tcr
  - bcr
  - repertoire
  - immunogenomics
  - rnaseq
tools:
  - "arda":
      description: |
        Antigen Receptor Domain Annotation. Filters receptor-derived reads out of bulk RNA-seq
        with a C++ 16-mer prefilter, annotates FR/CDR regions against IMGT-derived V(+pad+)J and
        J+C scaffolds, assembles long CDR3s that no single read spans, and collapses sequencing
        error into a clonotype table.
      homepage: "https://github.com/antigenomics/arda"
      documentation: "https://antigenomics.github.io/arda/"
      tool_dev_url: "https://github.com/antigenomics/arda"
      licence: ["GPL-3.0"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map with sample metadata. Must carry `single_end`, which selects whether R2 is
          passed through, e.g. [ id:'sample1', single_end:false ]. May optionally carry `regime`
          ('bulk' | 'amplicon' | 'default') to override `params.regime` for this sample only.
    - reads:
        type: file
        description: One FASTQ for single-end, or a two-element list [R1, R2] for paired.
        pattern: "*.{fastq,fq}{,.gz}"

output:
  - clones:
      - meta:
          type: map
          description: Groovy Map with sample metadata, passed through from the input channel.
      - "*.clones.tsv":
          type: file
          description: |
            Corrected clonotype table, keyed by (locus, v_call, j_call, junction). Columns:
            junction, junction_aa, v_call, j_call, c_call, locus, duplicate_count,
            consensus_count, d_call, d2_call, d_support, d2_support.
          pattern: "*.clones.tsv"
  - airr:
      - meta:
          type: map
          description: Groovy Map with sample metadata, passed through from the input channel.
      - "${prefix}.airr.tsv":
          type: file
          description: |
            Stage-1 mapped reads, AIRR Rearrangement schema. Matched by exact name, never
            `*.airr.tsv`: that glob also catches the assembler's `*.assembled.airr.tsv`, and the
            two would then arrive on this channel as a two-element list.
          pattern: "${prefix}.airr.tsv"
  - assembled_airr:
      - meta:
          type: map
          description: Groovy Map with sample metadata, passed through from the input channel.
      - "*.assembled.airr.tsv":
          type: file
          description: |
            Stage-3 assembled long-CDR3 contigs, AIRR Rearrangement schema. Optional: absent when
            arda is run with `--no-assemble`.
          pattern: "*.assembled.airr.tsv"
  - report:
      - meta:
          type: map
          description: Groovy Map with sample metadata, passed through from the input channel.
      - "*.arda.json":
          type: file
          description: |
            Merged per-stage run report: read counts, per-locus yield, wall time and peak RSS per
            stage, the arda/mmseqs versions and the reference fingerprint used, plus
            `fast_fraction` -- the predictor of whether the amplicon regime pays on this library.
          pattern: "*.arda.json"
  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions, and the regime the task ran in.
          pattern: "versions.yml"

authors:
  - "@mikessh"
maintainers:
  - "@mikessh"
