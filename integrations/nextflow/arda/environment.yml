channels:
  - conda-forge
  - bioconda
dependencies:
  - python >=3.10
  - bioconda::mmseqs2 >=15
  - pip
  - pip:
      # [rnaseq] pulls seqtree, which `arda rnaseq correct` needs. Without it the run dies
      # after writing the AIRR, before any clonotype table is produced.
      - arda-mapper[rnaseq]==2.5.1
